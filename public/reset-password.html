<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Social API Manager</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14151c; --surface: #1b1d27; --surface2: #242733;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #eef0f6; --muted: #8b8fa3;
  --accent: #6c8cff; --red: #fb7185; --green: #4ade80;
  --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2.25rem 2rem; width: 100%; max-width: 380px; }
.title { font-size: 20px; font-weight: 600; margin-bottom: 0.25rem; }
.subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.75rem; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 11px 12px; font-size: 14px; margin-bottom: 1rem; font-family: var(--sans); }
input:focus { outline: none; border-color: var(--accent); }
.btn { width: 100%; padding: 11px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--sans); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.msg { font-size: 13px; border-radius: 8px; padding: 10px 12px; margin-bottom: 1rem; display: none; }
.msg.show.err { display: block; background: rgba(251,113,133,0.12); color: var(--red); border: 1px solid rgba(251,113,133,0.25); }
.msg.show.ok { display: block; background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
.toggle-link { text-align: center; margin-top: 1.25rem; font-size: 13px; color: var(--muted); }
.toggle-link a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="title">Criar nova senha</div>
  <div class="subtitle" id="subtitle">Verificando seu link...</div>

  <div class="msg" id="msg"></div>

  <form id="form-reset" style="display:none">
    <label for="password">Nova senha</label>
    <input type="password" id="password" placeholder="Mínimo de 6 caracteres" required>
    <label for="password2">Confirme a nova senha</label>
    <input type="password" id="password2" placeholder="Repita a senha" required>
    <button type="submit" class="btn btn-primary">Salvar nova senha</button>
  </form>

  <div class="toggle-link">
    <a href="/login.html">Voltar para o login</a>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
const subtitle = document.getElementById('subtitle');
const form = document.getElementById('form-reset');

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

(async () => {
  if (!token) {
    subtitle.textContent = '';
    showMsg('Link de redefinição inválido. Solicite um novo na tela de login.', 'err');
    return;
  }

  try {
    const res = await fetch('/auth/login/reset-password/validar?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!data.valido) {
      subtitle.textContent = '';
      showMsg('Esse link não é mais válido ou já expirou. Solicite a redefinição de senha novamente.', 'err');
      return;
    }
    subtitle.textContent = 'Escolha uma nova senha para acessar sua conta.';
    form.style.display = 'block';
  } catch {
    subtitle.textContent = '';
    showMsg('Não foi possível verificar seu link agora. Tente novamente em alguns instantes.', 'err');
  }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (password !== password2) {
    showMsg('As senhas não são iguais. Digite a mesma senha nos dois campos.', 'err');
    return;
  }

  try {
    const res = await fetch('/auth/login/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(data.erro || 'Não foi possível redefinir sua senha. Tente novamente.', 'err');
      return;
    }
    form.style.display = 'none';
    subtitle.textContent = '';
    showMsg('Senha redefinida com sucesso! Redirecionando para o login...', 'ok');
    setTimeout(() => window.location.href = '/login.html', 2000);
  } catch {
    showMsg('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.', 'err');
  }
});
</script>

</body>
</html>
