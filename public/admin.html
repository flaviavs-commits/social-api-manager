<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração — Meu Ecoo Mídia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/i18n.js"></script>
<style>
:root {
  /* Mesma paleta do dashboard (app.html) — consistência de marca em toda a aplicação. */
  --bg: #111217; --surface: #181a20; --surface2: #21232b;
  --border: #2a2d36; --border2: #3a3e4a;
  --text: #eef0f6; --muted: #9096a8;
  --accent: #d1993e; --accent-glow: rgba(209,153,62,0.18);
  --green: #4ade80; --red: #fb7185; --yellow: #fbbf24;
  --sans: 'IBM Plex Sans', sans-serif;
  --radius: 10px; --radius-sm: 7px;
  --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
.topbar a { color: var(--accent); text-decoration: none; font-size: 13px; transition: opacity var(--transition); }
.topbar a:hover { opacity: 0.8; text-decoration: underline; }
.title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
.section-title { font-size: 18px; font-weight: 600; margin-bottom: 1rem; letter-spacing: -0.01em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 2rem; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background var(--transition); }
tbody tr:hover td { background: rgba(255,255,255,0.02); }
.pill { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; display: inline-block; }
.pill.admin { background: rgba(209,153,62,0.18); color: var(--accent); }
.pill.super_admin { background: rgba(251,191,36,0.15); color: var(--yellow); }
.pill.user { background: rgba(255,255,255,0.06); color: var(--muted); }
.pill.ativo { background: rgba(74,222,128,0.12); color: var(--green); }
.pill.inativo { background: rgba(251,113,133,0.12); color: var(--red); }
.btn {
  padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); font-size: 12px; cursor: pointer; font-family: var(--sans);
  transition: all var(--transition);
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.empty { text-align: center; color: var(--muted); padding: 2rem; }
.msg { font-size: 13px; padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 1rem; display: none; }
.msg.show.err { display: block; background: rgba(251,113,133,0.12); color: var(--red); border: 1px solid rgba(251,113,133,0.25); }
.msg.show.ok { display: block; background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::selection { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title" data-i18n="admin.titulo">Administração</div>
  <a href="/" data-i18n="admin.voltar">← Voltar ao painel</a>
</div>

<div class="main">
  <div class="msg" id="msg"></div>

  <div class="section-title" data-i18n="admin.usuarios">Usuários</div>
  <div class="card">
    <table>
      <thead><tr><th data-i18n="admin.colEmail">E-mail</th><th data-i18n="admin.colNome">Nome</th><th data-i18n="admin.colPapel">Papel</th><th data-i18n="admin.colSituacao">Situação</th><th data-i18n="admin.colContas">Contas</th><th></th></tr></thead>
      <tbody id="users-body"><tr><td colspan="6" class="empty" data-i18n="admin.carregando">carregando...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
  setTimeout(() => el.className = 'msg', 4000);
}

const API = 'https://social-api-manager-production.up.railway.app';  // backend (Railway) — front fica na Vercel

async function apiFetch(path, opts = {}) {
  const t = window.i18n.t;
  const token = localStorage.getItem('authToken');
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    ...opts
  });
  if (res.status === 401) {
    localStorage.removeItem('authToken');
    window.location.href = '/login.html';
    throw new Error(t('admin.sessaoExpirada'));
  }
  if (!res.ok) {
    let mensagem = t('admin.acaoFalhou');
    try { const data = await res.json(); if (data?.erro) mensagem = data.erro; } catch {}
    throw new Error(mensagem);
  }
  return res.json();
}

let currentUserId = null;
let currentUserRole = null;

async function loadUsers() {
  const t = window.i18n.t;
  const roleLabels = { super_admin: t('admin.roleSuperAdmin'), admin: t('admin.roleAdmin'), user: t('admin.roleUser') };
  const body = document.getElementById('users-body');
  try {
    const me = await apiFetch('/api/me');
    currentUserId = me.id;
    currentUserRole = me.role;
    const souSuperAdmin = currentUserRole === 'super_admin';

    const { data: users } = await apiFetch('/api/admin/users');
    if (!users.length) { body.innerHTML = `<tr><td colspan="6" class="empty">${t('admin.nenhumUsuario')}</td></tr>`; return; }

    body.innerHTML = users.map(u => {
      const isMe = u.id === currentUserId;
      const isSuperAdmin = u.role === 'super_admin';
      const roleActionLabel = u.role === 'admin' ? t('admin.tornarUsuario') : t('admin.tornarAdmin');
      const roleBtn = souSuperAdmin && !isSuperAdmin
        ? `<button class="btn" onclick="toggleRole(${u.id}, '${u.role}')">${roleActionLabel}</button>`
        : `<button class="btn" disabled title="${isSuperAdmin ? t('admin.papelDefinidoSistema') : t('admin.apenasSuperAdmin')}">${roleActionLabel}</button>`;
      return `<tr>
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(u.fullName || '—')}</td>
        <td><span class="pill ${u.role}">${roleLabels[u.role] || u.role}</span></td>
        <td><span class="pill ${u.ativo ? 'ativo' : 'inativo'}">${u.ativo ? t('admin.ativo') : t('admin.desativado')}</span></td>
        <td>${u.totalContas}</td>
        <td style="display:flex;gap:6px">
          ${roleBtn}
          <button class="btn" onclick="toggleAtivo(${u.id}, ${u.ativo})" ${isMe ? `disabled title="${t('admin.naoDesativarProprio')}"` : ''}>${u.ativo ? t('admin.desativar') : t('admin.ativar')}</button>
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`;
  }
}

async function toggleRole(id, currentRole) {
  const novoRole = currentRole === 'admin' ? 'user' : 'admin';
  try {
    await apiFetch(`/api/admin/users/${id}/role`, { method: 'POST', body: JSON.stringify({ role: novoRole }) });
    showMsg(window.i18n.t('admin.papelAtualizado'), 'ok');
    loadUsers();
  } catch (e) {
    showMsg(e.message, 'err');
  }
}

async function toggleAtivo(id, currentlyAtivo) {
  try {
    await apiFetch(`/api/admin/users/${id}/ativo`, { method: 'POST', body: JSON.stringify({ ativo: !currentlyAtivo }) });
    showMsg(window.i18n.t('admin.situacaoAtualizada'), 'ok');
    loadUsers();
  } catch (e) {
    showMsg(e.message, 'err');
  }
}

loadUsers();
window.addEventListener('langchange', loadUsers);
</script>

</body>
</html>
