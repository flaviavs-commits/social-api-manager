<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração — MeuEcooMedia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14151c; --surface: #1b1d27; --surface2: #242733;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #eef0f6; --muted: #8b8fa3;
  --accent: #6c8cff; --green: #4ade80; --red: #fb7185; --yellow: #fbbf24;
  --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; font-size: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--border); }
.topbar a { color: var(--accent); text-decoration: none; font-size: 13px; }
.title { font-size: 16px; font-weight: 600; }
.main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
.section-title { font-size: 18px; font-weight: 500; margin-bottom: 1rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 2rem; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.pill { font-size: 11px; padding: 3px 10px; border-radius: 99px; }
.pill.admin { background: rgba(108,140,255,0.15); color: var(--accent); }
.pill.super_admin { background: rgba(251,191,36,0.15); color: var(--yellow); }
.pill.user { background: rgba(255,255,255,0.06); color: var(--muted); }
.pill.ativo { background: rgba(74,222,128,0.12); color: var(--green); }
.pill.inativo { background: rgba(251,113,133,0.12); color: var(--red); }
.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 12px; cursor: pointer; font-family: var(--sans); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.empty { text-align: center; color: var(--muted); padding: 2rem; }
.msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 1rem; display: none; }
.msg.show.err { display: block; background: rgba(251,113,133,0.12); color: var(--red); border: 1px solid rgba(251,113,133,0.25); }
.msg.show.ok { display: block; background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">Administração</div>
  <a href="/">← Voltar ao painel</a>
</div>

<div class="main">
  <div class="msg" id="msg"></div>

  <div class="section-title">Usuários</div>
  <div class="card">
    <table>
      <thead><tr><th>E-mail</th><th>Nome</th><th>Papel</th><th>Situação</th><th>Contas</th><th></th></tr></thead>
      <tbody id="users-body"><tr><td colspan="6" class="empty">carregando...</td></tr></tbody>
    </table>
  </div>

  <div class="section-title">Todas as contas de redes sociais</div>
  <div class="card">
    <table>
      <thead><tr><th></th><th>Dono</th><th>Rede</th><th>Conta</th><th>Situação</th></tr></thead>
      <tbody id="accounts-body"><tr><td colspan="5" class="empty">carregando...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
  setTimeout(() => el.className = 'msg', 4000);
}

const API = 'https://social-api-manager-production.up.railway.app';  // backend (Railway) — front fica na Vercel

async function apiFetch(path, opts = {}) {
  const token = localStorage.getItem('authToken');
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    ...opts
  });
  if (res.status === 401) {
    localStorage.removeItem('authToken');
    window.location.href = '/login.html';
    throw new Error('Sessão expirada');
  }
  if (!res.ok) {
    let mensagem = 'Não foi possível concluir essa ação.';
    try { const data = await res.json(); if (data?.erro) mensagem = data.erro; } catch {}
    throw new Error(mensagem);
  }
  return res.json();
}

let currentUserId = null;
let currentUserRole = null;

const roleLabels = { super_admin: 'Administrador Principal', admin: 'Administrador', user: 'Usuário' };

async function loadUsers() {
  const body = document.getElementById('users-body');
  try {
    const me = await apiFetch('/api/me');
    currentUserId = me.id;
    currentUserRole = me.role;
    const souSuperAdmin = currentUserRole === 'super_admin';

    const { data: users } = await apiFetch('/api/admin/users');
    if (!users.length) { body.innerHTML = '<tr><td colspan="6" class="empty">nenhum usuário</td></tr>'; return; }

    body.innerHTML = users.map(u => {
      const isMe = u.id === currentUserId;
      const isSuperAdmin = u.role === 'super_admin';
      const roleBtn = souSuperAdmin && !isSuperAdmin
        ? `<button class="btn" onclick="toggleRole(${u.id}, '${u.role}')">${u.role === 'admin' ? 'Tornar usuário' : 'Tornar admin'}</button>`
        : `<button class="btn" disabled title="${isSuperAdmin ? 'Papel definido diretamente no sistema' : 'Apenas o administrador principal pode alterar papéis'}">${u.role === 'admin' ? 'Tornar usuário' : 'Tornar admin'}</button>`;
      return `<tr>
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(u.fullName || '—')}</td>
        <td><span class="pill ${u.role}">${roleLabels[u.role] || u.role}</span></td>
        <td><span class="pill ${u.ativo ? 'ativo' : 'inativo'}">${u.ativo ? 'Ativo' : 'Desativado'}</span></td>
        <td>${u.totalContas}</td>
        <td style="display:flex;gap:6px">
          ${roleBtn}
          <button class="btn" onclick="toggleAtivo(${u.id}, ${u.ativo})" ${isMe ? 'disabled title="Você não pode desativar sua própria conta"' : ''}>${u.ativo ? 'Desativar' : 'Ativar'}</button>
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`;
  }
}

async function toggleRole(id, currentRole) {
  const novoRole = currentRole === 'admin' ? 'user' : 'admin';
  try {
    await apiFetch(`/api/admin/users/${id}/role`, { method: 'POST', body: JSON.stringify({ role: novoRole }) });
    showMsg('Papel atualizado com sucesso.', 'ok');
    loadUsers();
  } catch (e) {
    showMsg(e.message, 'err');
  }
}

async function toggleAtivo(id, currentlyAtivo) {
  try {
    await apiFetch(`/api/admin/users/${id}/ativo`, { method: 'POST', body: JSON.stringify({ ativo: !currentlyAtivo }) });
    showMsg('Situação do usuário atualizada.', 'ok');
    loadUsers();
  } catch (e) {
    showMsg(e.message, 'err');
  }
}

const platLabels = { facebook: 'Facebook', instagram: 'Instagram', youtube: 'YouTube', tiktok: 'TikTok' };
const statusLabels = { valid: 'Funcionando', expiring: 'Vencendo', expired: 'Desconectada' };

async function loadAccounts() {
  const body = document.getElementById('accounts-body');
  try {
    const { data: contas } = await apiFetch('/api/admin/accounts');
    if (!contas.length) { body.innerHTML = '<tr><td colspan="5" class="empty">nenhuma conta conectada</td></tr>'; return; }

    const rows = contas.map(c => {
      const token = (c.tokens || []).find(t => t.platform === c.platform);
      const status = token ? (statusLabels[token.status] || token.status) : 'sem conexão';
      const avatar = c.avatarUrl
        ? `<img src="${escapeHtml(c.avatarUrl)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;display:block">`
        : `<div style="width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)">${escapeHtml((platLabels[c.platform] || c.platform)[0])}</div>`;
      return `<tr>
        <td>${avatar}</td>
        <td>${escapeHtml(c.ownerEmail || '—')}</td>
        <td>${escapeHtml(platLabels[c.platform] || c.platform)}</td>
        <td>${escapeHtml(c.handle)}</td>
        <td>${escapeHtml(status)}</td>
      </tr>`;
    });

    body.innerHTML = rows.join('');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="5" class="empty">${escapeHtml(e.message)}</td></tr>`;
  }
}

loadUsers();
loadAccounts();
</script>

</body>
</html>
