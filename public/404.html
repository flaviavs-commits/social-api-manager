<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131a; color: #f5f7fb; }
    main { width: min(90vw, 34rem); padding: 2rem; text-align: center; }
    main img { display: block; width: 190px; max-width: 100%; height: auto; margin: 0 auto 2.5rem; }
    h1 { margin: 0 0 .5rem; font-size: 4rem; }
    p { color: #b8c0d0; }
    a { color: #9db7ff; }
    .copyright-notice { margin-top: 2rem; color: #7f8aa3; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="Meu Ecoo Mídia - início"><img src="/logo.svg" alt="Meu Ecoo Mídia"></a>
    <h1>404</h1>
    <p>A página que você tentou acessar não existe ou foi removida.</p>
    <a href="/">Voltar para o início</a>
    <p class="copyright-notice">© <span data-current-year></span> Meu Ecoo Mídia. Todos os direitos reservados.</p>
  </main>
  <script>document.querySelectorAll('[data-current-year]').forEach(element => { element.textContent = new Date().getFullYear() })</script>
</body>
</html>
