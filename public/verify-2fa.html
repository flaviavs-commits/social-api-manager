<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação em 2 fatores — Meu Ecoo Mídia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Mesma paleta do dashboard (app.html) — consistência de marca em toda a aplicação. */
  --bg: #111217; --surface: #181a20; --surface2: #21232b;
  --border: #2a2d36; --border2: #3a3e4a;
  --text: #eef0f6; --muted: #9096a8;
  --accent: #d1993e; --accent-glow: rgba(209,153,62,0.18);
  --red: #fb7185; --green: #4ade80;
  --sans: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Sans', monospace;
  --radius-sm: 7px; --radius-lg: 16px;
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.5);
  --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; -webkit-font-smoothing: antialiased; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.25rem 2rem; width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
.title { font-size: 20px; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
.subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.75rem; line-height: 1.5; }
input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius-sm); padding: 11px 12px; font-size: 14px; margin-bottom: 1rem; font-family: var(--mono); text-align: center; letter-spacing: 0.3em; transition: border-color var(--transition), box-shadow var(--transition); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.btn { width: 100%; padding: 11px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--sans); transition: filter var(--transition), transform var(--transition); }
.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--bg); font-weight: 600; box-shadow: 0 4px 16px var(--accent-glow); }
.btn-primary:hover { filter: brightness(1.08); }
.msg { font-size: 13px; border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 1rem; display: none; }
.msg.show.err { display: block; background: rgba(251,113,133,0.12); color: var(--red); border: 1px solid rgba(251,113,133,0.25); }
.toggle-link { text-align: center; margin-top: 1.25rem; font-size: 13px; color: var(--muted); }
.toggle-link a { color: var(--accent); cursor: pointer; text-decoration: none; transition: opacity var(--transition); }
.toggle-link a:hover { opacity: 0.8; text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="title">Verificação em 2 fatores</div>
  <div class="subtitle">Digite o código de 6 dígitos do seu app autenticador para concluir o login.</div>

  <div class="msg" id="msg"></div>

  <form id="form-2fa">
    <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="000000" required autofocus>
    <button type="submit" class="btn btn-primary" id="btn-submit">Confirmar</button>
  </form>

  <div class="toggle-link">
    <a href="/login.html">Voltar para o login</a>
  </div>
</div>

<script>
const API = 'https://social-api-manager-production.up.railway.app';  // backend (Railway) — front fica na Vercel

// pendingToken chega por sessionStorage (fluxo senha→2FA, vindo de login.html)
// ou por ?pendingToken= na URL (fluxo Google→2FA, redirect direto do backend).
const pendingTokenFromUrl = new URLSearchParams(location.search).get('pendingToken');
if (pendingTokenFromUrl) {
  sessionStorage.setItem('pending2faToken', pendingTokenFromUrl);
  history.replaceState({}, '', location.pathname);
}

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show err';
}

document.getElementById('form-2fa').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  if (!/^\d{6}$/.test(code)) {
    showMsg('Digite o código de 6 dígitos do app autenticador.');
    return;
  }
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  try {
    const pendingToken = sessionStorage.getItem('pending2faToken');
    const res = await fetch(API + '/auth/login/verify-2fa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, pendingToken })
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(data.erro || 'Não foi possível verificar o código.');
      return;
    }
    sessionStorage.removeItem('pending2faToken');
    localStorage.setItem('authToken', data.token);
    window.location.href = '/app.html';
  } catch {
    showMsg('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.');
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
