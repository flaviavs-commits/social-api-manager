<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 140" width="486" height="140" role="img" aria-label="Meu Ecoo Mídia — Conecte. Crie. Agende. Cresça.">
<defs>
<linearGradient id="mmGold" x1="8%" y1="4%" x2="92%" y2="96%">
<stop offset="0%" stop-color="#ffe9ab"/>
<stop offset="45%" stop-color="#f3ba49"/>
<stop offset="100%" stop-color="#cf7f1c"/>
</linearGradient>
</defs>

<!-- Ícone (robô/balão de fala) -->
