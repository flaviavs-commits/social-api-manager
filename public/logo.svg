<!-- Tagline -->
<text x="133" y="103" xml:space="preserve" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="0.3">
<tspan fill="#aeb0b8">Conecte</tspan><tspan fill="#e3a83f">. </tspan><tspan fill="#aeb0b8">Crie</tspan><tspan fill="#e3a83f">. </tspan><tspan fill="#aeb0b8">Agende</tspan><tspan fill="#e3a83f">. </tspan><tspan fill="#aeb0b8">Cresça</tspan><tspan fill="#e3a83f">.</tspan>
