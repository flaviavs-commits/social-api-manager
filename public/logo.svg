<path d="M38,90 L61,98.5 L31.5,119 Z" fill="url(#mmGold)"/>
<rect x="6" y="32" width="88" height="64" rx="32" ry="32" fill="none" stroke="url(#mmGold)" stroke-width="13"/>
<line x1="50" y1="32" x2="50" y2="9" stroke="url(#mmGold)" stroke-width="9" stroke-linecap="round"/>
<circle cx="50" cy="7" r="7.5" fill="url(#mmGold)"/>
<circle cx="34" cy="64" r="7.2" fill="url(#mmGold)"/>
<circle cx="66" cy="64" r="7.2" fill="url(#mmGold)"/>
